<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="custom-checkbox-and-radio.css">
    <title>Custom Checkbox</title>
</head>

<body>
    <form>
        <h2>Radio</h2>
        <label>
            <input type="radio" id="option-1" value="Option 1" name="radio" checked>
            Option 1
        </label>

        <label>
            <input type="radio" id="option-2" value="Option 2" name="radio">
            Option 2
        </label>


        <h2>Checkbox</h2>
        <label class="switch lb">
            <input type="checkbox" name="checkbox-1" id="checkbox-1" checked>
            <span class="slider round"></span>Option 1
        </label>
        
        <label class="switch lb">
            <input type="checkbox" name="checkbox-2" id="checkbox-2">
            <span class="slider round"></span>Option 2
        </label>
       
    </form>
</body>

</html>
