<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="floating-labels.css">
    <title>Floating Labels</title>
</head>

<body>

    <form>
        <h2>Login</h2>
        <div class="field">
        <input type="email" id="email" name="email" aria-describedby="email-info" placeholder=" ">
        <label for="email">Email</label>
    </div>
        <p id="email-info">example: john@email.com</p>

        <div class="field">
        <input type="password" id="password" name="password" aria-describedby="pass-info" placeholder=" ">
        <label for="password">Password</label>
    </div>
        <p id="pass-info">minimum 6 characters, letters and numbers, at least 1 special character</p>

        <input type="submit" value="Login" id="login-btn">

    </form>


</body>

</html>
