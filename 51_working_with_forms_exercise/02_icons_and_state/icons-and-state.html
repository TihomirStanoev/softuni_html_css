<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="icons-and-state.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <title>Icons And State</title>
</head>

<body>
    <form>
        <h2>Login</h2>
        <hr>
        <label for="email">
            <span class="text">Email</span>
            <span class="icon"><i class="fa-regular fa-envelope"></i></span>
        </label>
        <input type="email" id="email" name="email" required aria-describedby="email-info">
        <p class="form-info" id="email-info">
            example: name@email.com
        </p>

        <label for="password">
            <span class="text">Password</span>
            <span class="icon"><i class="fa-solid fa-key"></i></span>
        </label>
        <input type="password" id="password" name="password" required aria-describedby="password-info">
        <p class="form-info" id="password-info">
            minimum 6 characters, letters and numbers, at least 1 special character.
        </p>
        <input type="submit" id="login-btn" value="Login">
    </form>

</body>

</html>
