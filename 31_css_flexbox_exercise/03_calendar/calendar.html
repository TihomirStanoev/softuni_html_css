<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calendar.css">
    <title>Calendar</title>
</head>

<body>

    <div class="calendar">
        <div class="rows">
            <div class="row">
                <div class="first-column">
                    <div class="week-type">Workweek</div>

                    <div class="days">
                        <div class="day">1 Monday</div>
                        <div class="day">2 Thuesday</div>
                        <div class="day">3 Wednesday</div>
                        <div class="day">4 Thursday</div>
                        <div class="day">5 Friday</div>
                    </div>


                </div>
                <div class="second-column">
                    SPECIAL DATES
                </div>
            </div>



            <div class="row">
                <div class="first-column">
                    <div class="week-type">Weekend</div>

                    <div class="days">
                        <div class="day">6 Saturday</div>
                        <div class="day">7 Sunday</div>
                    </div>


                </div>
                <div class="second-column">
                    REMINDERS
                </div>
            </div>

        </div>
    </div>


</body>

</html>
