<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="keyboard.css">
    <title>Keyboard</title>
</head>
<body>

<div class="keyboard">

    <div class="keys">
        <div class="button button-border first-row">esc</div>
        <div class="button button-border first-row">f1</div>
        <div class="button button-border first-row">f2</div>
        <div class="button button-border first-row">f3</div>
        <div class="button button-border first-row">f4</div>
        <div class="button button-border first-row">f5</div>
        <div class="button button-border first-row">f6</div>
        <div class="button button-border first-row">f7</div>
        <div class="button button-border first-row">f8</div>
        <div class="button button-border first-row">f9</div>
        <div class="button button-border first-row">f10</div>
        <div class="button button-border first-row">f11</div>
        <div class="button button-border first-row">f12</div>
        <div class="button button-border first-row">f13</div>
    </div>
    <div class="keys">
        <div class="button button-border second-row">§</div>
        <div class="button button-border second-row">1</div>
        <div class="button button-border second-row">2</div>
        <div class="button button-border second-row">3</div>
        <div class="button button-border second-row">4</div>
        <div class="button button-border second-row">5</div>
        <div class="button button-border second-row">6</div>
        <div class="button button-border second-row">7</div>
        <div class="button button-border second-row">8</div>
        <div class="button button-border second-row">9</div>
        <div class="button button-border second-row">0</div>
        <div class="button button-border second-row">-</div>
        <div class="button button-border second-row">+</div>
        <div class="button button-border backspace">backspace</div>
    </div>
    <div class="keys">
        <div class="button button-border tab">tab</div>
        <div class="button button-border second-row">q</div>
        <div class="button button-border second-row">w</div>
        <div class="button button-border second-row">e</div>
        <div class="button button-border second-row">r</div>
        <div class="button button-border second-row">t</div>
        <div class="button button-border second-row">y</div>
        <div class="button button-border second-row">u</div>
        <div class="button button-border second-row">i</div>
        <div class="button button-border second-row">o</div>
        <div class="button button-border second-row">p</div>
        <div class="button button-border second-row">[</div>
        <div class="button button-border second-row">]</div>
        <div class="button button-border enter-1">enter</div>
    </div>

    <div class="keys">
        <div class="button button-border caps">caps lock</div>
        <div class="button button-border second-row">a</div>
        <div class="button button-border second-row">s</div>
        <div class="button button-border second-row">d</div>
        <div class="button button-border second-row">f</div>
        <div class="button button-border second-row">g</div>
        <div class="button button-border second-row">h</div>
        <div class="button button-border second-row">j</div>
        <div class="button button-border second-row">k</div>
        <div class="button button-border second-row">l</div>
        <div class="button button-border second-row">;</div>
        <div class="button button-border second-row">'</div>
        <div class="button button-border second-row">\</div>
        <div class="button button-border enter-2"></div>
    </div>


    <div class="keys">
        <div class="button button-border caps">shift</div>
        <div class="button button-border second-row">`</div>
        <div class="button button-border second-row">z</div>
        <div class="button button-border second-row">x</div>
        <div class="button button-border second-row">c</div>
        <div class="button button-border second-row">v</div>
        <div class="button button-border second-row">b</div>
        <div class="button button-border second-row">n</div>
        <div class="button button-border second-row">m</div>
        <div class="button button-border second-row">,</div>
        <div class="button button-border second-row">.</div>
        <div class="button button-border second-row">/</div>
        <div class="button button-border r-shift">shift</div>
    </div>


    <div class="keys">
        <div class="button button-border tab">ctrl</div>
        <div class="button button-border win">win</div>
        <div class="button button-border tab">alt</div>
        <div class="button button-border space"> </div>
        <div class="button button-border win">alt</div>
        <div class="button button-border win">win</div>
        <div class="button button-border tab">ctrl</div>
    </div>




</div>



    
</body>
</html>
