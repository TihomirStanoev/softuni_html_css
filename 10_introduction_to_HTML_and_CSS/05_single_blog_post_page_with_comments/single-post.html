<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="single-post.css">
    <title>Post</title>
</head>
<body>

    <header>
        <h2>Blog Post Title</h2>
        <p class="publish-info">Posted by <span class="name">Author Name</span> on <time datetime="2024-01-24">January 24, 2024</time></p>
    </header>
    <main>
        <p>
            This is the introduction of your blog post...
        </p>
    </main>

    <section>
        <h2>Comments</h2>
        <p class="publish-info"><span class="name">John Doe</span> - <time datetime="2024-01-25"></time>January 25, 2024</time></p>
        <main>
            <article>
                <p>This is a comment on the blog post.</p>
            </article>
        </main>
    </section>

</body>
</html>
