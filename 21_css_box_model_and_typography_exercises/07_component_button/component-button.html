<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="component-button.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <title>Buttons</title>
</head>
<body>

<div class="a-buttons">
<h2>Link as a button</h2>
<a href="#" class="gray">Click Me!</a>
<a href="#" class="orange">Click Me!</a>
<a href="#" class="yellow">Click Me!</a>
<a href="#" class="white">Click Me!</a>
<a href="#" class="gray-icon">Edit</a>
</div>


<div class="a-buttons">
<h2>Button element with class button</h2>
<button class="gray">Click Me!</button>
<button class="orange">Click Me!</button>
<button class="yellow">Click Me!</button>
<button class="white">Click Me!</button>
<button class="gray-icon">Edit</button>
</div>
</body>
</html>
