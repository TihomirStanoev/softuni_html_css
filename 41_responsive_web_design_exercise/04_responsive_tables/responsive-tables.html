<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="responsive-tables.css">
    <title>Responsive Tables</title>
</head>

<body>


        <div class="table-container">
            <table>

                <caption>
                    <h2>Table Title</h2>
                </caption>
                <thead>
                    <tr>
                        <th>Title 1</th>
                        <th>Title 2 is fairly very long</th>
                        <th>Title 3</th>
                    </tr>
                </thead>
                <tbody>

                    <tr>
                        <td data-label="Title 1">Value 1</td>
                        <td data-label="Title 2 is fairly very long">Value 2</td>
                        <td data-label="Title 3">Value 3</td>
                    </tr>
                    <tr>
                        <td data-label="Title 1">Value 1</td>
                        <td data-label="Title 2 is fairly very long">Value 2</td>
                        <td data-label="Title 3">Value 3</td>
                    </tr>
                    <tr>
                        <td data-label="Title 1">Value 1</td>
                        <td data-label="Title 2 is fairly very long">Value 2</td>
                        <td data-label="Title 3">Value 3</td>
                    </tr>
                    <tr>
                        <td data-label="Title 1">Value 1</td>
                        <td data-label="Title 2 is fairly very long">Value 2</td>
                        <td data-label="Title 3">Value 3</td>
                    </tr>
                </tbody>
            </table>
        </div>


        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Header 1</th>
                        <th>Header 22</th>
                        <th>Header 33</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td data-label="Header 1">Row 1, Col 1</td>
                        <td data-label="Header 22">Row 1, Col 2</td>
                        <td data-label="Header 33">Row 1, Col 3</td>
                    </tr>
                    <tr>
                        <td data-label="Header 1">Row 1, Col 1</td>
                        <td data-label="Header 22">Row 1, Col 2</td>
                        <td data-label="Header 33">Row 1, Col 3</td>
                    </tr>
                    <tr>
                        <td data-label="Header 1">Row 1, Col 1</td>
                        <td data-label="Header 22">Row 1, Col 2</td>
                        <td data-label="Header 33">Row 1, Col 3</td>
                    </tr>
                </tbody>
            </table>
        </div>


</body>

</html>
